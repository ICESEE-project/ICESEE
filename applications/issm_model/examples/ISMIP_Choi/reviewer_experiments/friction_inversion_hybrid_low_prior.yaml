extends: friction_inversion_hybrid.yaml

enkf-parameters:
  # Reviewer sensitivity with an explicitly low-biased, but physically
  # consistent, initial geometry.  The offsets are applied to the model
  # background, never computed from the hidden truth realization.
  data_path: _reviewer_friction_inversion_hybrid_low_prior_v1
  initial_thickness_scale: 0.85
  initial_bed_offset_m: -80.0

  # Survey kriging is supported only beneath initially grounded ice.  Beneath
  # the shelf retain the model background instead of extrapolating grounded
  # tracks hundreds of kilometres into an unobserved domain.
  initial_bed_background_domain: grounded_only
