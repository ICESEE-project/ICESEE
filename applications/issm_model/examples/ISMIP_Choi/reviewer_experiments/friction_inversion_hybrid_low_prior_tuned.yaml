extends: friction_inversion_hybrid_low_prior.yaml

enkf-parameters:
  # Tuned hybrid sensitivity.  Preserve the successful 85%-thickness,
  # -80 m grounded-bed prior while increasing the number of state analyses.
  data_path: _reviewer_friction_inversion_hybrid_low_prior_tuned_v1

  # Choi-style annual surface/velocity observations, extended through year
  # 30.  Bed remains a separate sparse survey and is not observed annually.
  freq_obs: 1
  obs_max_time: 30
  bed_obs_snapshot: [2, 8, 14, 20, 24]

  # During years 1--5, update geometry but hold friction fixed.  Starting at
  # year 6, recover friction by member-wise ISSM inversion using the improved
  # analyzed geometry, reducing geometry/friction compensation.
  inversion_flag: 1
  inversion_start_time: 6.0
  frozen_analysis_vars: [coefficient]

  # The truth realization spans approximately 1813--4327 on grounded ice;
  # these wider bounds avoid forcing valid extrema onto the old 2000/4000
  # limits while remaining physically conservative.
  min_friction: 1500
  max_friction: 4500

  # Retain all five sparse survey epochs, which reduced grounded bed RMSE,
  # but soften each local correction to suppress the observed red overshoot
  # patches near survey corridors.
  bed_max_update_per_cycle: 20.0
  analysis_increment_limits:
    Thickness: 300.0
    Surface: 300.0
    Vx: 2500.0
    Vy: 2500.0
    bed: 20.0
