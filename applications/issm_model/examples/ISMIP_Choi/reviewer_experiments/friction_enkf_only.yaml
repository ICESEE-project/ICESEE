extends: friction_inversion_hybrid.yaml

enkf-parameters:
  # Joint augmented-state EnKF: friction is inferred through ensemble
  # cross-covariances; no deterministic ISSM inversion is called.
  data_path: _reviewer_friction_enkf_only_v5
  inversion_flag: 0
  frozen_analysis_vars: []
  localized_vars: [bed, coefficient]
  localization_radius:
    bed: 15000
    coefficient: 15000
  analysis_increment_limits:
    coefficient: 300.0
