extends: friction_inversion_hybrid_low_prior_tuned.yaml

enkf-parameters:
  # Reviewer robustness experiment: retain a moderately low mean background,
  # but make the local error sign change across the domain.  These modes are
  # generated only from mesh coordinates; they never use the hidden truth.
  data_path: _reviewer_friction_inversion_hybrid_heterogeneous_v1

  # Add a single broad, mixed-sign domain-scale thickness error.  The anomaly
  # is additive (metres), not proportional to local H, so thick grounded ice
  # cannot amplify it into the artificial 500--1000 m lobes seen in v1.
  initial_thickness_scale: 1.0
  initial_thickness_anomaly_fraction: 0.0
  initial_thickness_anomaly_m: 120.0
  initial_thickness_delta_min_m: -180.0
  initial_thickness_delta_max_m: 180.0
  initial_floating_thickness_anomaly_factor: 0.25
  initial_thickness_factor_min: 0.90
  initial_thickness_factor_max: 1.10

  # Preserve the literature-comparable -80 m mean bed challenge, but add a
  # separate sign-changing 120 m standard-deviation mode.  Bed is still
  # modified only beneath initially grounded ice.
  initial_bed_offset_m: -80.0
  initial_bed_anomaly_m: 120.0
  initial_bed_delta_min_m: -250.0
  initial_bed_delta_max_m: 150.0
  initial_bed_background_domain: grounded_only
  initial_bed_gl_buffer_m: 25000.0

  # These lengths now control only the independent bed field. Thickness uses
  # a non-periodic low-order tilt to preserve plausible sheet morphology.
  initial_prior_length_x_m: 120000.0
  initial_prior_length_y_m: 40000.0
  initial_prior_pattern_phase: 0.40
