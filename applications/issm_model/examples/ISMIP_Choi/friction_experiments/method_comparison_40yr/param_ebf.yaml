# EBF: EnKF jointly updates basal friction with the state and bed.
extends: param.yaml

enkf-parameters:
  data_path: _modelrun_datasets_method_comparison_40yr_ebf
  inversion_flag: 0
  inversion_start_time: 2.0
  frozen_analysis_vars: []
  localized_vars: [bed, coefficient]
  localization_radius:
    bed: 15000
    coefficient: 15000
  analysis_increment_limits:
    Thickness: 300.0
    Surface: 300.0
    Vx: 2500.0
    Vy: 2500.0
    bed: 20.0
    coefficient: 300.0

