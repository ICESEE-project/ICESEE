extends: param.yaml

modeling-parameters:
  # The matched smoke test showed that returning to dt=0.2 suppresses the
  # coefficient-to-state response.  Keep the validated timestep throughout.
  timesteps_per_year: 0.1

enkf-parameters:
  # Preserve the earlier dt=0.2 dataset for diagnosis.
  data_path: _modelrun_datasets_wbf_2_spinup_dt01
  initial_state_only: false
  generate_true_state: true
  generate_nurged_state: true
  generate_true_wrong_state_only: false
  generate_synthetic_obs_only: false
  inversion_flag: 0
  inversion_start_time: 2.0
  # Keep the deliberately wrong coefficient fixed.
  frozen_analysis_vars: [coefficient]
  # Matched pre-assimilation stabilization used by the successful smoke test.
  ensemble_spinup_years: 4.0
  ensemble_spinup_dt: 0.1
