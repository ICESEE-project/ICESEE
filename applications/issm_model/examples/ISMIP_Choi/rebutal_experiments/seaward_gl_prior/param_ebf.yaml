extends: param.yaml

modeling-parameters:
  # Required by the matched WBF/EBF coupling preflight.
  timesteps_per_year: 0.1

enkf-parameters:
  # Preserve the earlier non-propagating dt=0.2 dataset for diagnosis.
  data_path: _modelrun_datasets_ebf_2_spinup_dt01
  initial_state_only: false
  generate_true_state: true
  generate_nurged_state: true
  generate_true_wrong_state_only: false
  generate_synthetic_obs_only: false
  inversion_flag: 0
  inversion_start_time: 2.0
  # Let EnKF update coefficient jointly with the state and bed.
  frozen_analysis_vars: []
  # These are EBF-specific overrides from the canonical profile.  They must
  # be repeated here because this experiment extends the seaward-GL common
  # profile, not ../param_ebf.yaml.
  localized_vars: [bed, coefficient]
  localization_radius:
    bed: 15000
    coefficient: 15000
  analysis_increment_limits:
    Thickness: 300.0
    Surface: 300.0
    Vx: 2500.0
    Vy: 2500.0
    bed: 20.0
    coefficient: 300.0
  # Identical stabilization to WBF so their initial ensembles remain matched.
  ensemble_spinup_years: 4.0
  ensemble_spinup_dt: 0.1
