extends: param.yaml

enkf-parameters:
  data_path: _modelrun_datasets_wbf_1
  inversion_flag: 0
  # With inversion disabled, restoring the coefficient after every EnKF
  # analysis keeps the deliberately wrong friction fixed for all 50 years.
  frozen_analysis_vars: [coefficient]
  localized_vars: [bed]
  localization_radius:
    bed: 15000
