name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug repo layout (must show ICESEE/)
        shell: bash
        run: |
          pwd
          ls -la
          ls -la ICESEE || true
          ls -la ICESEE/__init__.py || true

      - name: Install pinned deps (CI lock)
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements/ci.txt

      - name: Install ICESEE (strict editable mode)
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,mpi,viz]" --config-settings editable_mode=strict

      - name: Verify import & run example
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}  
        run: |
          python --version
          python -c "import sys; print('\n'.join(sys.path))"  # should now include repo root near the top
          python -c "import ICESEE; print('ICESEE imported successfully:', ICESEE.__file__)"
          python -m ICESEE.applications.lorenz_model.examples.lorenz96.run_da_lorenz96
