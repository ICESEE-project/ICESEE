name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        shell: bash
        run: |
          python -m pip install --upgrade pip

      - name: Install pinned CI dependencies
        shell: bash
        run: |
          python -m pip install -r requirements/ci.txt
          python -c "import ICESEE; print('ICESEE import OK:', ICESEE.__file__)"

      - name: Run Lorenz96 example
        shell: bash
        run: |
          python -m ICESEE.applications.lorenz_model.examples.lorenz96.run_da_lorenz96