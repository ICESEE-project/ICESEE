name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Create virtual environment
        shell: bash
        run: |
          python -m venv icesee-env
          icesee-env/bin/python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        shell: bash
        run: |
          icesee-env/bin/python -m pip install -r requirements.txt

      - name: Install ICESEE (editable)
        shell: bash
        run: |
          icesee-env/bin/python -m pip install -e .
          icesee-env/bin/python -c "import ICESEE; print('ICESEE OK')"

      - name: Run Lorenz96 example
        shell: bash
        run: |
          icesee-env/bin/python -m ICESEE.applications.lorenz_model.examples.lorenz96.run_da_lorenz96