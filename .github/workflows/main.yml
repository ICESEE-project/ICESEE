
name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Set up virtual environment
        run: ./setup_venv.sh

      - name: Install ICESEE (venv)
        shell: bash
        run: |
          icesee-env/bin/python -m pip install -U pip
          icesee-env/bin/python -m pip install -e .
          icesee-env/bin/python -c "import ICESEE; import sys; print('OK', sys.executable, ICESEE)"

      - name: Debug python/pip
        shell: bash
        run: |
          which python || true; python -V || true
          which pip || true; pip -V || true
          icesee-env/bin/python -V
          icesee-env/bin/python -m pip -V
      - name: Run lorenz96 (venv)
        run: icesee-env/bin/python -m ICESEE.applications.lorenz_model.examples.lorenz96.run_da_lorenz96
