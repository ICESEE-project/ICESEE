name: CI
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create venv
        shell: bash
        run: |
          ./setup_venv.sh
          icesee-env/bin/python -V
          icesee-env/bin/python -m pip -V

      - name: Install ICESEE into venv and verify import
        shell: bash
        run: |
          icesee-env/bin/python -m pip install -U pip
          icesee-env/bin/python -m pip install -e .
          icesee-env/bin/python -c "import ICESEE; import sys; print('IMPORT OK', sys.executable)"

      - name: Run lorenz96 example (venv)
        shell: bash
        run: |
          icesee-env/bin/python -m ICESEE.applications.lorenz_model.examples.lorenz96.run_da_lorenz96