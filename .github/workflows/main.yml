
name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Set up venv, install ICESEE, run lorenz96
        shell: bash
        run: |
          ./setup_venv.sh
          source icesee-env/bin/activate
          make install
          python -c "import ICESEE; print('ICESEE OK:', ICESEE)"
          python -m ICESEE.applications.lorenz_model.examples.lorenz96.run_da_lorenz96
