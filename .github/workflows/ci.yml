name: CI

on:
  push:
    branches: [main, develop, develop_new, "icesee/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install ICESEE
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements/ci.txt
          python -m pip install -e ".[dev,mpi,viz]"

      - name: Setup ICESEE paths
        run: |
            bash scripts/ci_setup.sh

      - name: Test ICESEE import
        run: |
            echo "ICESEE_ROOT=$ICESEE_ROOT"
            echo "PYTHONPATH=$PYTHONPATH"
            python - <<'PY'
            import os
            import sys
            import importlib

            root = os.environ["ICESEE_ROOT"]
            if root not in sys.path:
                sys.path.insert(0, root)

            m = importlib.import_module("ICESEE")
            print("ICESEE imported from:", m.__file__)
            PY

      - name: Run Lorenz96 CI example and generate figure
        run: |
          mkdir -p docs/figures
          python scripts/run_lorenz96_ci.py

      - name: Upload Lorenz96 figure artifact
        uses: actions/upload-artifact@v4
        with:
          name: lorenz96-ci-figure
          path: docs/figures/lorenz96_ci.png

      - name: Ensure README contains Lorenz96 CI figure
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()

          block = """
          ## ICESEE CI Lorenz96 smoke test

          The figure below is generated automatically by the CI workflow after installing ICESEE and running the Lorenz96 example.

          ![Lorenz96 CI result](docs/figures/lorenz96_ci.png)
          """

          marker = "## ICESEE CI Lorenz96 smoke test"

          if marker not in text:
              text = text.rstrip() + "\n\n" + block.strip() + "\n"
              readme.write_text(text)
          PY

      - name: Commit updated CI figure and README
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Lorenz96 CI figure"
          file_pattern: docs/figures/lorenz96_ci.png README.md