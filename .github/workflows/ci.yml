name: CI

on:
  push:
    branches: [main, develop, develop_new, "icesee/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repository root is the ICESEE package itself, so it is checked out into a
# directory named ICESEE; a fork checked out as e.g. ICESEE-dev is otherwise not
# importable as `ICESEE`. Both the package parent and the package directory are
# on PYTHONPATH because the code base uses both `from ICESEE.src...` and
# `from src...` imports.
env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/ICESEE
  OMP_NUM_THREADS: "1"

defaults:
  run:
    working-directory: ICESEE

jobs:
  fast-tests:
    name: fast-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          path: ICESEE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install ICESEE
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements/ci.txt
          python -m pip install -e ".[dev,mpi,viz]"

      - name: Setup ICESEE paths
        run: |
            bash scripts/ci/ci_setup.sh

      - name: Test ICESEE import
        run: |
            echo "ICESEE_ROOT=$ICESEE_ROOT"
            echo "PYTHONPATH=$PYTHONPATH"
            python - <<'PY'
            import os
            import sys
            import importlib

            root = os.environ["ICESEE_ROOT"]
            if root not in sys.path:
                sys.path.insert(0, root)

            m = importlib.import_module("ICESEE")
            print("ICESEE imported from:", m.__file__)
            PY

      # Every test module that needs neither Firedrake/Icepack, ISSM, external
      # datasets, nor an mpirun launch; new test modules are picked up
      # automatically. The excluded modules run in mpi-tests below or are
      # Firedrake/PACE validation (see docs/testing.md).
      - name: Run fast deterministic tests
        timeout-minutes: 15
        run: |
          timeout --kill-after=30s 12m python -m pytest -q src/tests \
            --ignore=src/tests/parallel_mpi \
            --ignore=src/tests/test_resource_plan_mpi_topology.py \
            --ignore=src/tests/test_mpi_failure_handling.py \
            --ignore=src/tests/test_lorenz96_mode2_p_nens_matrix.py \
            --ignore=src/tests/test_enkf_parallel_io_topology.py \
            --ignore=src/tests/test_lorenz_mode3_runner.py \
            --ignore=src/tests/test_mode3_large_state_benchmark.py \
            --ignore=src/tests/test_func.py \
            --ignore=src/tests/test_icepack_checkpoint_communicator.py \
            --ignore=src/tests/test_icepack_compact_initialization.py \
            --ignore=src/tests/test_icepack_compact_initialization_synthetic.py \
            --ignore=src/tests/test_icepack_idealized_pig_native.py \
            --ignore=src/tests/test_icepack_mesh_communicator.py \
            --ignore=src/tests/test_icepack_mode3_runner.py \
            --ignore=src/tests/test_icepack_multirank_analysis.py \
            --ignore=src/tests/test_icepack_physical_nudge.py \
            --ignore=src/tests/test_basal_melt_true_wrong_experiment.py \
            --ignore=src/tests/test_synthetic_ice_stream_h5py_dataset_path.py \
            --ignore=src/tests/test_config_extends.py \
            --deselect=src/tests/test_run_models_da_dispatch.py::test_icepack_real_bootstrap_self_heals_without_a_prior_mode3_runner_import

  mpi-tests:
    name: mpi-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          path: ICESEE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MPI and parallel HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev libhdf5-openmpi-dev pkg-config

      - name: Install ICESEE
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements/ci.txt
          python -m pip install -e ".[dev,mpi,viz]"

      # Modes 1 and 2 open shared ensemble files with h5py's mpio driver, which
      # the PyPI h5py wheel does not provide.
      - name: Build MPI-enabled h5py
        timeout-minutes: 15
        run: |
          H5PY_VERSION="$(python -c 'import h5py; print(h5py.__version__)')"
          CC=mpicc HDF5_MPI=ON HDF5_PKGCONFIG_NAME=hdf5-openmpi \
            python -m pip install --no-binary=h5py --no-cache-dir --force-reinstall --no-deps \
            "h5py==${H5PY_VERSION}"
          python -c "import h5py; assert h5py.get_config().mpi, 'h5py was built without MPI'; print('h5py', h5py.__version__, 'mpi:', h5py.get_config().mpi)"

      - name: Setup ICESEE paths
        run: |
            bash scripts/ci/ci_setup.sh

      - name: Check MPI launcher
        timeout-minutes: 2
        run: |
          python - <<'PY'
          from ICESEE.src.tests._mpi_launcher import find_compatible_mpi_launcher
          launcher = find_compatible_mpi_launcher()
          assert launcher is not None, "no mpirun compatible with mpi4py was found"
          print("MPI launcher:", launcher)
          PY

      - name: Run Lorenz96 CI example and generate figure
        timeout-minutes: 10
        run: |
          mkdir -p applications/lorenz_model/examples/lorenz96/_modelrun_datasets/figures
          timeout --kill-after=30s 8m python scripts/ci/run_lorenz96_ci.py

      # Real multi-rank runs. Every mpirun launch inside these tests has its
      # own subprocess timeout; the outer timeout bounds the whole step so a
      # communicator regression cannot hang the runner.
      - name: Run MPI tests
        timeout-minutes: 20
        run: |
          timeout --kill-after=30s 18m python -m pytest -q -rs \
            --junitxml=mpi-report.xml \
            src/tests/test_resource_plan_mpi_topology.py \
            src/tests/test_mpi_failure_handling.py \
            src/tests/test_lorenz96_mode2_p_nens_matrix.py \
            src/tests/test_enkf_parallel_io_topology.py \
            src/tests/test_lorenz_mode3_runner.py \
            src/tests/test_mode3_large_state_benchmark.py

      # A skipped MPI test means no usable launcher or parallel HDF5 was found,
      # not that the behavior was verified.
      - name: Require that no MPI test was skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("mpi-report.xml").getroot()
          skipped = [f"{case.get('classname')}::{case.get('name')}"
                     for case in root.iter("testcase") if case.find("skipped") is not None]
          assert not skipped, "MPI tests were skipped:\n" + "\n".join(skipped)
          print("No MPI tests were skipped.")
          PY

      - name: Upload Lorenz96 figure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorenz96-ci-figure
          path: ICESEE/applications/lorenz_model/examples/lorenz96/_modelrun_datasets/figures/lorenz96_ci.png
          if-no-files-found: warn
