name: CI

on:
  push:
    branches: [main, develop, develop_new, "icesee/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install ICESEE
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements/ci.txt
          python -m pip install -e ".[dev,mpi,viz]"

      - name: Setup ICESEE paths
        run: |
            bash scripts/ci/ci_setup.sh

      - name: Test ICESEE import
        run: |
            echo "ICESEE_ROOT=$ICESEE_ROOT"
            echo "PYTHONPATH=$PYTHONPATH"
            python - <<'PY'
            import os
            import sys
            import importlib

            root = os.environ["ICESEE_ROOT"]
            if root not in sys.path:
                sys.path.insert(0, root)

            m = importlib.import_module("ICESEE")
            print("ICESEE imported from:", m.__file__)
            PY

      - name: Run Lorenz96 CI example and generate figure
        run: |
          mkdir -p applications/lorenz_model/examples/lorenz96/_modelrun_datasets/figures
          python scripts/ci/run_lorenz96_ci.py

      - name: Upload Lorenz96 figure artifact
        uses: actions/upload-artifact@v4
        with:
          name: lorenz96-ci-figure
          path: applications/lorenz_model/examples/lorenz96/_modelrun_datasets/figures/lorenz96_ci.png

      - name: Ensure README contains Lorenz96 CI figure
        run: |
            python - <<'PY'
            from pathlib import Path

            readme = Path("README.md")
            text = readme.read_text()

            marker = "## ICESEE CI Lorenz96 smoke test"
            insert_before = "## AI/ML Integration"

            block = """
            ## ICESEE CI Lorenz96 smoke test

            The figure shown below is generated directly from the automated test workflow of Lorenz96 and serves as a lightweight end-to-end verification of the framework.

            ![Lorenz96 CI result](applications/lorenz_model/examples/lorenz96/_modelrun_datasets/figures/lorenz96_ci.png)

            **Figure:** Automatically generated by the ICESEE CI workflow after executing the Lorenz-96 assimilation benchmark. The figure compares the true trajectory, background forecast, synthetic observations, and ensemble analysis produced by ICESEE.

            ---
            """

            if marker in text:
                start = text.index(marker)
                next_section = text.find("\n## ", start + len(marker))

                if next_section == -1:
                    text = text[:start].rstrip()
                else:
                    text = text[:start].rstrip() + "\n\n" + text[next_section:].lstrip()

            if insert_before in text:
                text = text.replace(insert_before, block.strip() + "\n\n" + insert_before, 1)
            else:
                text = text.rstrip() + "\n\n" + block.strip() + "\n"

            readme.write_text(text)
            PY

      - name: Commit updated CI figure and README
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # The generated figure is intentionally tracked even though the
          # surrounding model-output directory is ignored.
          add_options: "-f"
          commit_message: "Update Lorenz96 CI figure"
          file_pattern: applications/lorenz_model/examples/lorenz96/_modelrun_datasets/figures/lorenz96_ci.png README.md
