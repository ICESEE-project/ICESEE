name: Update README with Flags

on:
  push:
    branches: [main, develop, restructure]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install pyyaml  # Uncomment if pyyaml is needed

      - name: Update README
        working-directory: config
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Running update_readme.py in config/"
          python update_readme.py

      - name: Check for changes in README
        id: check_changes
        run: |
          git add README.md  # Adjust path if README.md is in a different directory, e.g., ../README.md
          if git diff --staged --quiet; then
            echo "No changes in README.md"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in README.md"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update README with latest flags"

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${{ github.ref_name }}