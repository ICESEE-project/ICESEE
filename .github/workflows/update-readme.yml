name: Update README with Flags

on:
  push:
    branches:
      - main
      - develop
      - restructure

permissions:
  contents: write  # Required for git commit and push

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # Ensures clean push auth

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          # Add any deps your script needs, e.g., pip install pyyaml  # If using YAML parsing

      - name: Update README
        working-directory: config
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Running update_readme.py in config/"
          python update_readme.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # If your script writes config/README.md, add that file. Otherwise use -A.
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update README with latest flags"
          git push